name: Send WhatsApp Reminders

on:
  schedule:
    # Corre cada 15 minutos de forma automática y gratuita
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite disparar el cron manualmente desde la interfaz de GitHub

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ] || [[ "$TARGET_URL" == *"reset-art-barber-shop"* ]]; then
            TARGET_URL="https://puntobarba-barberia.vercel.app"
          fi
          
          # Quitar barra diagonal final si existe
          CLEAN_URL=$(echo "$TARGET_URL" | sed 's/\/$//')
          
          echo "Disparando recordatorios en: $CLEAN_URL/api/cron-reminders"
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$CLEAN_URL/api/cron-reminders")
          status_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          
          echo "Estado HTTP devuelto: $status_code"
          echo "Respuesta del servidor: $body"
          
          if [ "$status_code" -ne 200 ]; then
            echo "Error: El endpoint de recordatorios devolvió el estado $status_code"
            exit 1
          fi
